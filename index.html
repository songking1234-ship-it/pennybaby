<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>妮妮的文字天地｜小日常，大成長</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF8F4; --ink:#1B1A1F; --ink-soft:#5B5861; --line:#E4DED6;
  --red:#C8202F; --red-soft:#F7E3E3; --gold:#E0A91F; --card:#FFFFFF;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141317; --ink:#F1EEE9; --ink-soft:#A9A5AE; --line:#2B2931;
    --red:#FF5A66; --red-soft:#2A1A1D; --card:#1C1B20;
  }
}
:root[data-theme="dark"]{
  --paper:#141317; --ink:#F1EEE9; --ink-soft:#A9A5AE; --line:#2B2931;
  --red:#FF5A66; --red-soft:#2A1A1D; --card:#1C1B20;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.7}
.wrap{max-width:720px;margin:0 auto}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.mast{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:14px}
.mast a{text-decoration:none;font-family:var(--serif);font-weight:900;font-size:16px;letter-spacing:.04em}
.mast span{color:var(--ink-soft)}

.hero{position:relative;margin:0;background:#0b0b0e}
.hero img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 28%}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:62%;background:linear-gradient(to top,rgba(10,10,14,.92),rgba(10,10,14,0))}
.hero-text{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 22px 26px;color:#fff}
.hero-text p{margin:0 0 6px;font-size:14px;opacity:.88}
.hero-text h1{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(40px,12vw,76px);line-height:1.08;letter-spacing:.02em}
.hero-text .by{margin-top:10px;font-size:15px;opacity:.92}

/* home */
.intro{padding:22px 22px 6px}
.intro p{margin:0 0 14px;font-family:var(--serif);font-size:17px;line-height:1.9;color:var(--ink)}
.follow{display:inline-block;padding:10px 16px;border:1px solid var(--red);border-radius:22px;color:var(--red);text-decoration:none;font-weight:500;font-size:14px}
.feature{display:block;margin:26px 22px 8px;border:1px solid var(--line);background:var(--card);border-radius:4px;overflow:hidden;color:inherit;text-decoration:none}
.feature img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:50% 40%}
.feature div{padding:14px 16px 16px}
.feature b{display:block;font-family:var(--serif);font-weight:900;font-size:22px;line-height:1.3}
.feature span{font-size:14px;color:var(--ink-soft)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:22px 22px 12px}
.chips button{padding:7px 14px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:18px;font:500 14px var(--sans)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.list{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.item time{font-size:13px;line-height:1.35;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.item time i{display:block;font-style:normal;opacity:.75}
.item b{display:block;font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.45}
.item small{display:block;margin-top:2px;font-size:14px;color:var(--ink-soft);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* article */
.back{display:inline-block;margin:18px 22px 0;font-size:14px;color:var(--ink-soft);text-decoration:none}
.head{padding:14px 22px 0}
.head h1{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(28px,7.5vw,40px);line-height:1.3}
.meta{margin-top:10px;font-size:14px;color:var(--ink-soft)}
.article-cover{position:relative;margin:18px 22px 0;min-height:220px;padding:26px;border-radius:18px;overflow:hidden;color:#fff;background:linear-gradient(135deg,#8b2030,#e0a91f)}
.article-cover::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 20%,rgba(255,255,255,.33) 0 3px,transparent 4px),radial-gradient(circle at 15% 85%,rgba(255,255,255,.18) 0 2px,transparent 3px);background-size:38px 38px,29px 29px;opacity:.7}
.article-cover.school{background:linear-gradient(135deg,#1d5861,#80a89b)}
.article-cover.fruit{background:linear-gradient(135deg,#d06b45,#f3b45f)}
.article-cover.life{background:linear-gradient(135deg,#62537f,#d09dba)}
.article-cover .cover-mark{position:absolute;right:24px;bottom:-12px;font-size:116px;line-height:1;filter:drop-shadow(0 8px 8px rgba(0,0,0,.16))}
.article-cover .cover-label{position:relative;z-index:1;font-size:13px;letter-spacing:.16em;opacity:.88}
.article-cover h2{position:relative;z-index:1;margin:14px 0 0;max-width:78%;font-family:var(--serif);font-size:clamp(25px,7vw,42px);line-height:1.28}
.article-cover .cover-line{position:relative;z-index:1;width:46px;height:3px;margin-top:18px;background:#fff;border-radius:4px}
.body{margin:18px 22px 0;padding:24px 20px 4px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(40,32,25,.06)}
.body p{margin:0 0 1.4em;font-family:var(--serif);font-size:19px;line-height:2;max-width:34em;white-space:pre-line}
.tags{padding:18px 22px 0;font-size:14px;color:var(--ink-soft)}
.tags span{display:inline-block;margin:0 10px 0 0}
.note{margin:6px 22px 0;padding:12px 14px;background:var(--red-soft);border-left:4px solid var(--red);font-size:15px}
.note a{color:var(--red);word-break:break-all}
figure.photo{margin:30px 0 0}
figure.photo img{display:block;width:100%;height:auto}
figure.photo figcaption{padding:10px 22px 0;font-size:13px;color:var(--ink-soft)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:40px 22px 0}
.pager a{display:block;padding:12px 14px;border:1px solid var(--line);background:var(--card);border-radius:4px;text-decoration:none;font-size:14px;color:var(--ink-soft)}
.pager a b{display:block;margin-top:2px;font-family:var(--serif);font-weight:600;font-size:15px;line-height:1.4;color:var(--ink)}
.pager a.next{text-align:right}
.pager a.void{visibility:hidden}

/* essay */
.teacher{margin:0 0 34px;padding:14px 16px;background:var(--red-soft);border-left:4px solid var(--red);border-radius:2px}
.teacher q{display:block;quotes:none;font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.6;color:var(--red)}
.teacher small{display:block;margin-top:4px;font-size:13px;color:var(--ink-soft)}
.essay{padding:30px 22px 0}
.essay p{margin:0 0 1.5em;font-family:var(--serif);font-size:19px;line-height:2;max-width:34em;text-indent:2em}
.essay p.hot{position:relative;margin-left:-14px;padding-left:10px;border-left:3px solid var(--red);margin-top:2.4em}
.essay p.hot::before{content:"老師圈起來的一段";position:absolute;left:10px;top:-1.6em;font:500 12px/1 var(--sans);color:var(--red);text-indent:0}
.g{border-radius:2px}
body.proof .g{background:rgba(224,169,31,.35);box-shadow:0 1px 0 var(--gold)}
.scan{margin:44px 22px 0;padding-top:28px;border-top:1px solid var(--line)}
.scan h2{margin:0 0 6px;font-family:var(--serif);font-weight:900;font-size:22px}
.scan p{margin:0 0 14px;font-size:14px;color:var(--ink-soft)}
.scan button{display:block;width:100%;padding:0;border:1px solid var(--line);background:var(--card);border-radius:4px;overflow:hidden;cursor:zoom-in}
.scan button img{display:block;width:100%;height:auto}

dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;padding:0;border:0;background:#000}
dialog::backdrop{background:#000}
dialog .box{width:100%;height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
dialog img{display:block;width:230%;max-width:none;height:auto}
dialog .x{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:2;padding:8px 14px;border:0;border-radius:20px;background:#fff;color:#111;font:500 14px var(--sans)}

.foot{margin-top:44px;padding:20px 22px 34px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--ink-soft)}
.foot a{color:var(--red);text-decoration:none;font-weight:500}
.foot button{padding:8px 12px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:18px;font:500 13px var(--sans)}
@media (min-width:720px){.hero img{aspect-ratio:4/4.4}.body p,.essay p{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast"><a href="#/">妮妮的文字天地</a><span>小日常，大成長</span></header>
  <div id="app"></div>
</div>

<dialog id="scanDlg">
  <button class="x" type="button" id="closeScan">關閉</button>
  <div class="box"><img id="scanBig" alt="手寫原稿放大"></div>
</dialog>

var ESSAY_HTML=
'<p>我參加的比賽，勇奪第一名，才得去日本參賽的資格。我們都很高興，更是真的<span class="g">光榮</span>。</p>'+
'<p>我們一團五十八人坐上飛機，到了日本。比賽當天，我<span class="g">很緊張又興奮</span>，做好了<span class="g">準備</span>上場。<span class="g">挺胸抬頭</span>，讓我們更有自信。我們一出場，家長就一直<span class="g">加油</span>，在<span class="g">定點</span>開始<span class="g">喊口號</span>，聲音<span class="g">洪亮</span>，讓我們的氣勢十足。</p>'+
'<p class="hot">音樂響起，我們出現在舞台，有<span class="g">各種</span>的舞蹈。有的被拋到空中，像小鳥一樣在空中飛舞；有的在地上<span class="g">蹦</span>跳，像兔子一樣活潑；有的人站立，像一<span class="g">座移</span>動的金字塔。觀眾看到我們做出高難度的動作，都非常<span class="g">熱烈</span>的鼓勵，因為我們平常努力不懈的<span class="g">練習</span>，還犧牲假日來參加。一分耕耘，一分收穫，得到了第二名的好成績。</p>'+
'<p>能去日本比賽是一件很特別的事情，因為別人去日本都是去玩，而我是去比賽，還能得第二名，是難能可貴的經驗。</p>';

{id:"peach",cat:"水果",date:"2026-03-11",title:"甜桃走進教室",tags:["粉紅色","水果","作文"],text:
"春天到了，\n甜桃擦了粉紅色腮紅，\n噴了香水，\n從果園走出來，\n走進教室。\n我看到甜桃就直流口水，\n洗乾淨後就送進我的嘴巴，\n吃起來又甜又脆，\n還有撲鼻的香味，\n我吃得齒甲留香，\n心情也很愉快，\n感謝甜桃為我帶來的美好時光。"},
{id:"sports-day",cat:"學校",date:"2026-02-09",title:"運動會：運動家的精神",tags:["運動會","運動家","精神"],text:
"星期五是運動會，\n一大早我精神飽滿的到學校。\n我們二年級的趣味競賽是夾球跳，\n最讓印象深刻的是二班夾球跳，跳一跳之後就跌倒了，\n可是他不氣餒，站起來繼續跳，這就是運動家的精神。\n我在夾球跳的時候很靈活，\n就像一隻可愛的袋鼠，\n因為我平常都有在運動。\n我們班有十個女生，十個男生去參加折返跑接力。\n我們班發揮團結合作的精神，\n可惜沒有得到前三名，\n可是我們不氣餒，這也是運動家的精神。"},
{id:"parade",cat:"學校",date:"2026-02-09",title:"快樂踩街，迎接校慶八十年！",tags:["踩街","校慶"],text:
"星期三學校舉辦踩街活動，\n我頭上戴著兔子的頭套，\n穿著紀念衫到操場集合。\n主任先站起來，接著讓我們走出大門，\n然後開始踩街，\n我們聽著南陽校歌和台灣尚勇這兩首歌踩著愉快的腳步前進，\n路上的行人都和我們揮手，我們覺得很光榮，也熱情地揮手。\n為什麼要踩街呢?\n因為我們要向鄰居宣傳八十周年校慶快到了~"},
{id:"popcorn-rice",cat:"學校",date:"2026-02-09",title:"白米魔法秀──我的爆米香體驗",tags:["小朋友","壓力鍋","大哥"],text:
"星期二我們去四角坑旁邊的空地，\n認識爆米香的製作過程，\n我們滿心期待的排隊出發。\n米香大哥把白米倒入壓力鍋，接著等候十分鐘，\n蹦! 一聲，\n好像打雷一樣，\n然後加入麥芽糖、沙拉油、砂糖等等的材料，\n最後壓平定型、切塊，香氣四溢的爆米香就完成了!\n老師將爆米香分給表現好的小朋友，\n我就是其中之一。\n我迫不及待地咬下一口，\n又香又美味的爆米香讓我吃的津津有味，\n我覺得米香大哥好像在變魔術，因為好像白米變身秀。"},
{id:"new-year",cat:"啦啦隊",date:"2026-02-09",title:"2025 ~ 2026 跨新年",tags:["日本公開賽","新年"],text:
"12月31日晚上，\n我和全家一邊看電視，一邊吃餅乾，感覺非常開心，\n因為可以跟家人跨年。\n然後我們寫下新年新希望，\n我的新希望是: 國語、數學都考100分、日本賽拿第一和拿到很多紅包，\n真是美好的一天。"},
{id:"japan-open",cat:"啦啦隊",date:"2026-02-09",title:"2026 競技啦啦隊 日本公開賽",tags:["日本公開賽","集訓","啦啦隊","日本","教練"],photo:true,text:
"星期三我們準備出發去日本\n我的心情是期待\n因為我要去日本比啦啦隊。\n到達日本我的心情既緊張又興奮。\n到了飯店卸下行李後，休息片刻，接下來就是辛苦的集訓練習，\n教練們非常嚴厲指導我們各種技能，\n雖然在集訓過程中每個動作都要做到十分準確，\n過程中有的人產生口角，有的人想放棄，\n但是教練給我們極大的信心，我們必須先戰勝心裏的緊張、恐懼。\n比賽正式開始，來自亞洲菁英的選手，大家都拿出實力來，\n比賽成績我們奪亞軍的獎盃，\n我們非常高興及榮幸，\n回來繼續練習，希望下次能得到冠軍回來。"},
{id:"library",cat:"學校",date:"2026-02-05",title:"【創作花園】我愛圖書館",tags:["圖書館"],text:
"圖書館就像知識的寶庫，聰明的我最喜歡到那裡挖寶。\n\n一走進圖書館，我就提醒自己要放輕腳步、降低音量，當一個守規矩的好讀者。書架上的書彷彿都在向我招手，我立刻走到書架前，左挑右選，找到一本自己喜歡的書，坐在沙發區閱讀，和作者一起進入書中的世界。\n\n翻開一本可愛的繪本，我看到一隻好奇的小猴子，竟然學主人打電話，還打到消防隊，讓主人拿牠沒辦法，只好把牠送到動物園。我一邊看一邊笑，覺得故事真有趣！\n\n去圖書館看書是一個很好的習慣，不但可以學到很多知識，也能懂得更多道理。我希望大家都能常常到圖書館報到！",
 note:{text:"這篇有上人間福報喔~~",link:"https://www.merit-times.com.tw/NewsPage.aspx?unid=926268",label:"看人間福報報導"}},
{id:"nanyang-80",cat:"學校",date:"2025-12-10",title:"南陽八十·活力滿滿的我",tags:["學校","幸福","綠色","國小"],text:
"南陽國小已經建校80周年，\n就像80歲的老爺爺,\n可是他老當益壯,\n新的大樓來新氣象,\n有更多的學生來到南陽國小,\n成為中部地區人數最多的小學。\n我穿上草綠色的建校周年紀念衫。\n覺得很光榮，\n因為綠色代表有活力，\n充滿著希望。\n我想天天穿著它,\n提醒自己要充滿活力的學習，\n當個人人稱讚的南陽好學生。"},
{id:"forest",cat:"生活",date:"2025-12-03",title:"森林是我們的肺",tags:["森林","姊弟","地球","旅行團"],text:
"星聽五我聽了一個故事\n有一對姊弟跟著旅行團去森林裡採藍莓\n他們竟然拿著放大鏡在大太陽底下生火\n被其他旅客發現冒出白煙\n急急忙忙的從小溪提水滅火\n終於把火熄滅\n我覺得這對姊弟沒有愛護地球的觀念\n竟然膽大包天的放火\n被爸媽責罵還偷笑\n這種不知悔改的態度很不應該\n我提醒大家要愛護森林\n因為森林是地球的肺\n也是新鮮空氣的製造機。"},
{id:"relay",cat:"學校",date:"2025-11-19",title:"不放棄的力量：我的折返跑接力賽",tags:["學校","小朋友","接力","精神","體育課","比賽"],text:
"星期二的體育課,\n老師教我們折返跑,\n男女分組開始比賽。\n我盡全力的向前跑,\n像花豹一樣靈活,\n接近三角錐就放慢速度折返,\n跑回原點把接力棒交給下一位同學,\n要團隊合作才能贏得比賽。\n可是有些同學掉棒,\n他立刻撿起接力棒往前衝,\n我覺得這種不放棄的精神是運動員都要擁有的精神。\n我們女生三戰兩勝,贏了男生。\n我心裡雖然高興，\n但是勝不驕敗不餒也是運動家該有的精神。"},
{id:"field-trip",cat:"學校",date:"2025-10-29",title:"戶外教學開心的一天",tags:["學校","小朋友","戶外","小人國","遊覽車","萬聖節"],text:
"星期二去戶外教學，\n我們興高采烈搭上遊覽車，\n大約兩小時就到了目的地小人國。\n我看到萬聖節的裝飾，\n牆上掛著骷髏頭，\n天花板掛著蜘蛛網，\n看起來很可怕。\n接下來我們去玩旋轉木馬，\n坐在上面忽高忽低的晃動，\n好像真的在騎馬。\n最後我又去坐船、跳星星，都很好玩。\n我覺得戶外教學可以讓我學習排隊要耐心等待。"},
{id:"apple",cat:"水果",date:"2025-10-22",title:"蘋果的香氣課",tags:["學校","幸福","小朋友","水果"],text:
"星期二是吃水果的日子\n我特別期待，\n因為我喜歡吃水果。\n這個水果穿著紅色外套,\n身上還噴著香水,\n當我看到他走進教室時，\n高興地想跳起來。\n第二節下課就是我們吃水果的時間,\n我先帶蘋果去洗澡洗掉身上的灰塵,\n就可以開吃了。\n喀!我大口吃了起來,\n又香又甜又脆,\n也能補充營養,\n因為: 一天一蘋果,醫生遠離我。"},
{id:"quake",cat:"學校",date:"2025-10-17",title:"警報響起——我的地震演練日",tags:["學校","小朋友","演習","地震","警報","演練"],text:
"星期五的時候,\n學校舉行地震演練，\n因為台灣很常發生地震,\n從不告知別人何時要來,\n而且地震像惡魔一樣,\n會把房子壓垮,\n也會把人壓死,\n非常可怕!\n老師教我們認真演練,\n聽到警報聲就要迅速地躲到桌子下面,\n警報聲停止後~\n就要戴著頭套去操場集合,\n演習就結束了。\n多一分準備就少一分損失,我提醒大家演習時要認真~"},
{id:"banana",cat:"水果",date:"2025-10-17",title:"甜蜜的彎月——我最喜歡的水果香蕉",tags:["學校","香蕉","媽媽","水果","幸福","台灣特色"],text:
"星期五吃的水果像彎彎的月亮,\n穿著黃黃的外套,\n脫掉外套後就露出白白的皮膚,\n吃起來甜如蜜,\n牙齒不好的人都可以吃得笑咪咪,\n你猜這是什麼水果?\n答案就是:香蕉。\n香蕉是台灣的特產,\n我很喜歡吃香蕉。\n因為吃香蕉很方便，\n不用再請媽媽削皮，\n香蕉吃起來又香又甜,\n還能幫消化~\n是很棒的水果。"},
{id:"cockroach",cat:"生活",date:"2025-10-16",title:"擊退夏日蟑螂大軍：媽媽的妙招與孩子的趣味提醒",tags:["學校","小朋友","蟑螂","媽媽"],text:
"媽媽說夏天來了，蟑螂也來了。\n因為天氣炎熱，蟑螂的繁殖力變強了。\n蟑螂是不速之客，\n沒經過我們的同意，\n就闖入我們家，\n在房間、廚房和浴室逛來逛去，\n媽媽看了一腳踩下去，還說：「看來蟑螂是不想活了。」\n我勸蟑螂趕快搬家，不要自尋死路。"},
{id:"pineapple",cat:"水果",date:"2025-10-15",title:"金色盔甲的鳳梨",tags:["學校","鳳梨","小朋友","幸福","台灣特色"],text:
"星期一上完體育課，\n我們就可以吃鳳梨。\n還沒削的鳳梨像穿著金黃色盔甲，\n當我們要吃它的時候，\n就脫掉盔甲，\n露出金黃色的肌肉。\n我聞到鳳梨的香味就垂涎三尺，\n馬上吃了兩塊，香甜多汁，真是好吃。\n鳳梨是台灣的特產，我能吃到美味可口的鳳梨很幸福。"},
{id:"mooncake",cat:"學校",date:"2025-10-15",title:"學校的蛋黃酥：一份充滿愛與幸福的中秋禮",tags:["中秋節快樂","學校","小朋友","幸福","蛋黃酥"],text:
"星期三學校有發蛋黃酥\n看起來像圓圓的月亮\n還散發出迷人的香味\n我有一點捨不得吃\n可是又受不了香味的誘惑\n忍不住大口吃了起來\n脆脆的外皮 甜甜的紅豆 鹹鹹的蛋黃 真是美味\n還有一種幸福的滋味\n因為這是學校的愛心\n祝全校小朋友中秋節快樂 月圓人團圓"}
];

var CATS=["全部","啦啦隊","學校","水果","生活"];
var curCat="全部";
var app=document.getElementById("app");

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function fmtDate(d){return d.replace(/-/g,"/")}
function firstLine(a){return a.excerpt||a.text.split("\n")[0].replace(/[,，、]$/,"")}
function byId(id){for(var i=0;i<A.length;i++){if(A[i].id===id)return i}return -1}

function itemHTML(a){
  var d=a.date?'<time datetime="'+a.date+'"><i>'+a.date.slice(0,4)+'</i>'+a.date.slice(5).replace("-",".")+'</time>':'<time><i>最新</i>2026</time>';
  return '<a class="item" href="#/a/'+a.id+'">'+d+'<div><b>'+esc(a.title)+'</b><small>'+esc(firstLine(a))+'</small></div></a>';
}

function listHTML(){
  var out="";
  for(var i=0;i<A.length;i++){
    if(curCat==="全部"||A[i].cat===curCat){out+=itemHTML(A[i])}
  }
  return out;
}

function home(){
  document.title="妮妮的文字天地｜小日常，大成長";
  var chips="";
  for(var i=0;i<CATS.length;i++){
    chips+='<button type="button" data-cat="'+CATS[i]+'" aria-pressed="'+(CATS[i]===curCat)+'">'+CATS[i]+'</button>';
  }
  app.innerHTML=
  '<figure class="hero"><img src="'+IMG.hero+'" alt="妮妮在啦啦隊比賽舞台上，高舉彩球、張口喊出口號，身後隊友站在同伴肩上">'+
  '<figcaption class="hero-text"><p>妮妮的生活週記</p><h1>小日常，<br>大成長</h1></figcaption></figure>'+
  '<section class="intro"><p>學校的故事、朋友的冒險、生活的驚喜。用文字留住童年的光。</p>'+
  '<a class="follow" href="'+SALON+'" target="_blank" rel="noopener">到方格子追蹤妮妮</a></section>'+
  '<a class="feature" href="#/a/japan-essay"><img src="'+IMG.podium+'" alt="妮妮穿著 ALBERT 隊服，比著勝利手勢，站在 Cheer Japan 的旗幟下">'+
  '<div><b>去日本比賽</b><span>最新的一篇作文，附手寫原稿與老師評語</span></div></a>'+
  '<div class="chips" id="chips" role="group" aria-label="依主題篩選">'+chips+'</div>'+
  '<div class="list" id="list">'+listHTML()+'</div>'+
  '<footer class="foot"><span>共 '+A.length+' 篇　沛妮的文字，爸爸整理。</span><a href="'+SALON+'" target="_blank" rel="noopener">方格子沙龍</a></footer>';
}

function pager(i){
  var newer=i>0?A[i-1]:null, older=i<A.length-1?A[i+1]:null;
  return '<nav class="pager" aria-label="上一篇與下一篇">'+
    (newer?'<a href="#/a/'+newer.id+'">較新<b>'+esc(newer.title)+'</b></a>':'<a class="void" aria-hidden="true" tabindex="-1">&nbsp;</a>')+
    (older?'<a class="next" href="#/a/'+older.id+'">較舊<b>'+esc(older.title)+'</b></a>':'<a class="void next" aria-hidden="true" tabindex="-1">&nbsp;</a>')+
  '</nav>';
}

function coverHTML(a){
  var kind=a.cat==="學校"?"school":(a.cat==="水果"?"fruit":(a.cat==="生活"?"life":""));
  var mark=a.cat==="水果"?"🍎":(a.cat==="學校"?"✎":(a.cat==="生活"?"☁":"✦"));
  return '<section class="article-cover '+kind+'"><div class="cover-label">'+esc(a.cat||"生活週記")+'　/　沛妮的文字</div><h2>'+esc(a.title)+'</h2><div class="cover-line"></div><div class="cover-mark" aria-hidden="true">'+mark+'</div></section>';
}

function essay(i){
  var a=A[i];
  document.title=a.title+"｜妮妮的文字天地";
  app.innerHTML=
  '<figure class="hero"><img src="'+IMG.hero+'" alt="妮妮在啦啦隊比賽舞台上，高舉彩球、張口喊出口號">'+
  '<figcaption class="hero-text"><p>生活週記</p><h1>去日本比賽</h1><div class="by">作者　沛妮</div></figcaption></figure>'+
  '<a class="back" href="#/">← 全部週記</a>'+
  '<article class="essay"><aside class="teacher"><q>第三段寫得太生動了，真的很棒！</q><small>老師的評語</small></aside>'+ESSAY_HTML+'</article>'+
  '<figure class="photo"><img src="'+IMG.podium+'" alt="妮妮穿著 ALBERT 隊服，比著勝利手勢，站在 Cheer Japan 與國際啦啦隊總會的旗幟下" loading="lazy">'+
  '<figcaption>在 Cheer Japan 與國際啦啦隊總會（ICU）的旗幟下。</figcaption></figure>'+
  '<section class="scan"><h2>手寫原稿</h2><p>稿紙上的紅筆是老師的批改。點一下可以放大。</p>'+
  '<button type="button" data-open-scan aria-label="放大手寫原稿"><img src="'+IMG.scan+'" alt="沛妮〈去日本比賽〉的手寫稿紙，上有老師的紅筆圈點與評語" loading="lazy"></button></section>'+
  pager(i)+
  '<footer class="foot"><span>沛妮的文字，爸爸整理。</span><button type="button" id="proof" aria-pressed="'+document.body.classList.contains("proof")+'">'+(document.body.classList.contains("proof")?"關閉校對":"校對模式")+'</button></footer>';
}

function article(i){
  var a=A[i];
  if(a.special==="essay"){return essay(i)}
  document.title=a.title+"｜妮妮的文字天地";
  var paras=a.text.split("\n\n"), body="";
  for(var k=0;k<paras.length;k++){body+="<p>"+esc(paras[k])+"</p>"}
  var tags="";
  if(a.tags){for(var t=0;t<a.tags.length;t++){tags+="<span>#"+esc(a.tags[t])+"</span>"}}
  var note=a.note?'<div class="note">'+esc(a.note.text)+' <a href="'+a.note.link+'" target="_blank" rel="noopener">'+esc(a.note.label)+'</a></div>':"";
  var photo=a.photo?'<figure class="photo"><img src="'+IMG.podium+'" alt="妮妮穿著 ALBERT 隊服，比著勝利手勢，站在 Cheer Japan 與國際啦啦隊總會的旗幟下" loading="lazy"><figcaption>在 Cheer Japan 與國際啦啦隊總會（ICU）的旗幟下。</figcaption></figure>':"";
  app.innerHTML=
  '<a class="back" href="#/">← 全部週記</a>'+ 
  coverHTML(a)+
  '<header class="head"><h1>'+esc(a.title)+'</h1><div class="meta">作者　沛妮　'+fmtDate(a.date)+'</div></header>'+ 
  '<div class="body">'+body+'</div>'+note+photo+
  '<div class="tags">'+tags+'</div>'+
  pager(i)+
  '<footer class="foot"><span>喜歡這篇？</span><a href="'+SALON+'" target="_blank" rel="noopener">到方格子追蹤妮妮</a></footer>';
}

function route(){
  var h=location.hash.replace(/^#\/?/,"");
  if(h.indexOf("a/")===0){
    var i=byId(h.slice(2));
    if(i>=0){article(i);window.scrollTo(0,0);return}
  }
  home();
  window.scrollTo(0,0);
}

document.addEventListener("click",function(e){
  var t=e.target;
  while(t&&t!==document&&!(t.getAttribute&&(t.hasAttribute("data-cat")||t.hasAttribute("data-open-scan")||t.id==="proof"||t.id==="closeScan"))){t=t.parentNode}
  if(!t||t===document)return;
  if(t.hasAttribute("data-cat")){
    curCat=t.getAttribute("data-cat");
    var bs=document.querySelectorAll("#chips button");
    for(var i=0;i<bs.length;i++){bs[i].setAttribute("aria-pressed",String(bs[i].getAttribute("data-cat")===curCat))}
    document.getElementById("list").innerHTML=listHTML();
  }else if(t.hasAttribute("data-open-scan")){
    var dlg=document.getElementById("scanDlg");
    document.getElementById("scanBig").src=IMG.scan;
    if(dlg.showModal){dlg.showModal()}else{dlg.setAttribute("open","")}
  }else if(t.id==="closeScan"){
    var d2=document.getElementById("scanDlg");
    if(d2.close){d2.close()}else{d2.removeAttribute("open")}
  }else if(t.id==="proof"){
    var on=document.body.classList.toggle("proof");
    t.setAttribute("aria-pressed",String(on));
    t.textContent=on?"關閉校對":"校對模式";
  }
});
window.addEventListener("hashchange",route);
route();
})();
</script>
